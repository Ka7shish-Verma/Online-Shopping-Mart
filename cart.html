<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Cart - ShopKart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">ShopKart <span>Fashion ⚡</span></a>
        <div class="nav-links">
            <a href="products.html">Dresses</a>
        </div>
    </header>

    <div class="container" style="margin-top:20px;">
        <div class="cart-layout">
            <div class="panel">
                <h2>My Shopping Cart</h2>
                <div id="cart-items"></div>
            </div>
            <div class="panel">
                <h3>Price Details</h3>
                <hr style="margin: 12px 0;">
                <p style="display:flex; justify-content:space-between; margin-bottom:15px;">
                    <span>Total Amount:</span>
                    <b id="total-price">₹0</b>
                </p>
                <a href="checkout.html"><button class="btn-orange" style="width:100%;">PLACE ORDER</button></a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        function renderCart() {
            const cart = getCart();
            const container = document.getElementById('cart-items');
            if(cart.length === 0) {
                container.innerHTML = "<p style='padding:20px 0;'>Your cart is currently empty.</p>";
                document.getElementById('total-price').textContent = '₹0';
                return;
            }
            
            let total = 0;
            container.innerHTML = cart.map(item => {
                total += item.price * item.quantity;
                return `
                    <div class="cart-item">
                        <img src="${item.image}">
                        <div>
                            <h4>${item.title}</h4>
                            <p class="current-price" style="margin-top:6px;">₹${item.price.toLocaleString('en-IN')} x ${item.quantity}</p>
                        </div>
                    </div>
                `;
            }).join('');
            document.getElementById('total-price').textContent = `₹${total.toLocaleString('en-IN')}`;
        }
        renderCart();
    </script>
</body>
</html>
