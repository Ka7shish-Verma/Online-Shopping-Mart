<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checkout - ShopKart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">ShopKart <span>Fashion ⚡</span></a>
    </header>

    <div class="container" style="max-width: 600px; margin-top: 30px;">
        <div class="panel">
            <h2 style="margin-bottom: 20px;">Delivery Address</h2>
            <form id="checkout-form">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="name" required placeholder="Enter full name">
                </div>
                <div class="form-group">
                    <label>Mobile Number</label>
                    <input type="tel" id="phone" required placeholder="10-digit mobile number">
                </div>
                <div class="form-group">
                    <label>Delivery Address</label>
                    <textarea id="address" rows="3" required placeholder="House No, Street, Pincode"></textarea>
                </div>
                <button type="submit" class="btn-orange" style="width:100%;">CONFIRM & PLACE ORDER</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        document.getElementById('checkout-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const cart = getCart();
            if (cart.length === 0) return alert('Your cart is empty!');

            const totalAmount = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const payload = {
                customer: {
                    name: document.getElementById('name').value,
                    phone: document.getElementById('phone').value,
                    address: document.getElementById('address').value
                },
                items: cart,
                totalAmount
            };

            const res = await fetch('/api/orders', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await res.json();
            if (data.success) {
                alert(`Order Placed Successfully!\nOrder ID: ${data.orderId}`);
                localStorage.removeItem('cart');
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
